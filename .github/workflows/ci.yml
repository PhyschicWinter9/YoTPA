name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle itself must run on JDK <= 21 (Gradle 8.13 cannot run on JDK 25);
      # the foojay resolver in settings.gradle.kts auto-provisions the JDK 25
      # toolchain used to actually compile (see CLAUDE.md §1).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # plugin.yml / messages.yml go through Groovy `expand()` for ${version}
      # substitution — any *other* literal `$` in either file breaks the build
      # (CLAUDE.md §1, §6). Catch it before spending a build on it.
      - name: Guard against stray '$' in templated resources
        shell: bash
        run: |
          FILES="src/main/resources/plugin.yml src/main/resources/messages.yml"
          STRAY=$(grep -n '\$' $FILES | grep -vF '${version}' || true)
          if [ -n "$STRAY" ]; then
            echo "$STRAY"
            echo "::error::Literal '\$' found outside \${version} in a templated resource — this breaks processResources' Groovy expansion."
            exit 1
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoTPA-${{ github.sha }}
          path: build/libs/YoTPA-*.jar
          if-no-files-found: error
