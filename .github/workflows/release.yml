name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.6.2) — must already exist"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A manual workflow_dispatch run has no tag ref of its own — it runs
      # against whatever branch/tag the user picked in the Actions UI, which
      # defaults to the repo's default branch. Trusting github.ref_name there
      # silently treated "main" as a version once (`vmain` != PLUGIN_VERSION).
      # Require an explicit, pre-existing tag input instead of guessing.
      - name: Resolve target tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::'$TAG' is not a v<major>.<minor>.<patch> tag."
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # VersionConfig.PLUGIN_VERSION in build.gradle.kts is the single source
      # of truth (CLAUDE.md §1/§7). The release tag must match it exactly, or
      # this fails fast instead of shipping a JAR whose internal version
      # disagrees with the GitHub Release tag / Modrinth listing.
      - name: Resolve and verify version
        id: version
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TAG="${TAG#v}"
          BUILD=$(grep -oP 'PLUGIN_VERSION\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "tag=$TAG"
          echo "build.gradle.kts=$BUILD"
          if [ "$TAG" != "$BUILD" ]; then
            echo "::error::Tag v$TAG does not match VersionConfig.PLUGIN_VERSION ($BUILD) in build.gradle.kts"
            exit 1
          fi
          echo "version=$BUILD" >> "$GITHUB_OUTPUT"

      # Release checklist (CLAUDE.md §7) requires a CHANGELOG.md entry before
      # tagging — this pulls that entry in as the Release body, and fails the
      # release outright if it's missing instead of publishing without notes.
      - name: Extract changelog section for this version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && (index($0, "## [") == 1 || $0 == "---") { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION (expected a '## [$VERSION]' heading)."
            exit 1
          fi
          cat release-notes.md

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify release JAR exists
        shell: bash
        run: test -f "build/libs/YoTPA-${{ steps.version.outputs.version }}.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "YoTPA ${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: build/libs/YoTPA-${{ steps.version.outputs.version }}.jar
          generate_release_notes: true
