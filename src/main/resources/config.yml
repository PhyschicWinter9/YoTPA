# ═══════════════════════════════════════════════════════════════
#                YoTPA Configuration v1.3.0-Adaptive
#           Smart Auto-Optimization for All Server Sizes
# ═══════════════════════════════════════════════════════════════

# Request timeout in seconds (how long before a request expires)
# Recommended: 30-120 seconds
request-timeout: 60

# Request cooldown in seconds (how long before sending another request)
# Recommended: 15-60 seconds
request-cooldown: 30

# Teleport delay in seconds (countdown before actual teleport)
# Recommended: 3-10 seconds
teleport-delay: 5

# ═══════════════════════════════════════════════════════════════
#                    PERFORMANCE SETTINGS
# ═══════════════════════════════════════════════════════════════
# The plugin will automatically detect your server's RAM and adjust
# its performance settings accordingly. You can override this by
# changing the mode below.

performance:
  # Performance mode options:
  # - AUTO: Automatically detect based on available RAM (RECOMMENDED)
  # - ULTRA_LIGHT: For 512 MB - 1 GB RAM (Free/Cheap VPS)
  # - LIGHT: For 1-2 GB RAM (Low-end servers)
  # - BALANCED: For 2-4 GB RAM (Mid-range servers)
  # - HIGH_PERFORMANCE: For 4+ GB RAM (High-end servers)
  mode: AUTO

# ═══════════════════════════════════════════════════════════════
#                 PERFORMANCE MODE DETAILS
# ═══════════════════════════════════════════════════════════════
#
# ULTRA_LIGHT (≤ 768 MB RAM):
#   - No async executor (Bukkit scheduler only)
#   - Minimal caching
#   - 30s expiration checks
#   - 5min cache cleanup
#   - 0.5 block movement threshold
#   - Best for: 5-10 players, minimal plugins
#
# LIGHT (≤ 1.5 GB RAM):
#   - 2 executor threads
#   - Moderate caching
#   - 20s expiration checks
#   - 4min cache cleanup
#   - 0.4 block movement threshold
#   - Best for: 10-15 players, light plugins
#
# BALANCED (≤ 3 GB RAM):
#   - 3 executor threads
#   - Full caching
#   - 10s expiration checks
#   - 2min cache cleanup
#   - 0.3 block movement threshold
#   - Best for: 15-25 players, moderate plugins
#
# HIGH_PERFORMANCE (> 3 GB RAM):
#   - 4 executor threads
#   - Full caching
#   - 5s expiration checks
#   - 1min cache cleanup
#   - 0.25 block movement threshold (most strict)
#   - Best for: 25+ players, any plugins
#
# ═══════════════════════════════════════════════════════════════

# Sound effects (use Minecraft sound names)
# Format: lowercase with dots or underscores (no "minecraft:" prefix)
# Examples: "block.note_block.pling", "entity.enderman.teleport"
# Test in-game: /playsound minecraft:block.note_block.pling master @s
# Full list: https://minecraft.wiki/w/Sounds.json
sounds:
  # Sound when countdown starts (plays every second)
  countdown: "block.note_block.pling"

  # Sound when teleport succeeds
  success: "entity.enderman.teleport"

  # Sound when teleport is cancelled
  cancel: "entity.villager.no"

  # Sound when request is received
  request: "entity.experience_orb.pickup"

# ═══════════════════════════════════════════════════════════════
#                    FEATURE TOGGLES
# ═══════════════════════════════════════════════════════════════

features:
  # Enable statistics tracking (/tpastats command)
  statistics: true

  # Enable bStats metrics (helps developers understand usage)
  bstats: true

  # Enable title animations during countdown
  titles: true

  # Enable sound effects
  sounds: true

# ═══════════════════════════════════════════════════════════════
#                    OPTIMIZATION TIPS
# ═══════════════════════════════════════════════════════════════
#
# For FREE/LOW-SPEC servers (512 MB - 1 GB):
# 1. Keep mode as AUTO or ULTRA_LIGHT
# 2. Limit total plugins to 5-8
# 3. Set view-distance to 4 in server.properties
# 4. Use Paper instead of Spigot
# 5. Limit players to 5-10 concurrent
#
# For MID-RANGE servers (2-4 GB):
# 1. Use AUTO or BALANCED mode
# 2. Can run 10-15 plugins
# 3. view-distance 6-8
# 4. 15-25 players should be fine
#
# For HIGH-END servers (4+ GB):
# 1. Use AUTO or HIGH_PERFORMANCE mode
# 2. No significant plugin limitations
# 3. view-distance 10-12
# 4. 25+ players supported
#
# Need help? Use these commands:
# - /tpainfo - View current performance mode and system info
# - /tpareload - Reload configuration (validates settings)
# - /tpastats - View teleport statistics
#
# ═══════════════════════════════════════════════════════════════