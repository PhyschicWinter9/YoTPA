name: YoTPA
version: 1.4.0
main: com.relaxlikes.yoTPA.YoTPA
api-version: 1.21
author: PhyschicWinter9 & VIBEs Coding XD
description: Smart adaptive teleport plugin that automatically optimizes for any server size
website: https://github.com/relaxlikes/yoTPA

# Load early to reduce startup time
load: STARTUP

commands:
  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
    permission: yotpa.use
    aliases: [teleportask]

  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept
    permission: yotpa.use

  tpadeny:
    description: Deny a teleport request
    usage: /tpadeny
    permission: yotpa.use
    aliases: [tpdeny]

  tpahere:
    description: Request a player to teleport to you
    usage: /tpahere <player>
    permission: yotpa.use

  tpareload:
    description: Reload the plugin configuration
    usage: /tpareload
    permission: yotpa.reload

  tpastats:
    description: View teleport statistics
    usage: /tpastats
    permission: yotpa.stats

  tpainfo:
    description: View system information and performance mode
    usage: /tpainfo
    permission: yotpa.info

permissions:
  yotpa.use:
    description: Allow using basic TPA commands
    default: true

  yotpa.reload:
    description: Allow reloading the configuration
    default: op

  yotpa.stats:
    description: Allow viewing statistics
    default: op

  yotpa.info:
    description: Allow viewing system information
    default: op

  yotpa.bypass.cooldown:
    description: Bypass teleport request cooldown
    default: op

  yotpa.bypass.timeout:
    description: Bypass request timeout expiration
    default: op

  yotpa.*:
    description: All YoTPA permissions
    default: op
    children:
      yotpa.use: true
      yotpa.reload: true
      yotpa.stats: true
      yotpa.info: true
      yotpa.bypass.cooldown: true
      yotpa.bypass.timeout: true